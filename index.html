<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Account Service</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .toggle-link { color: #007bff; cursor: pointer; margin-top: 15px; display: inline-block; text-decoration: underline; }
        .hidden { display: none; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
        .success { color: green; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Status Section -->
    <div id="status-section" class="hidden">
        <h2>Welcome!</h2>
        <p id="user-email"></p>
        <button id="btn-logout">Sign Out</button>
    </div>

    <!-- Sign In Form -->
    <div id="signin-section">
        <h2>Sign In</h2>
        <input type="email" id="signin-email" placeholder="Email Address" required>
        <input type="password" id="signin-password" placeholder="Password" required>
        <button id="btn-signin">Sign In</button>
        <p class="toggle-link" id="link-to-signup">Don't have an account? Sign Up</p>
    </div>

    <!-- Sign Up Form -->
    <div id="signup-section" class="hidden">
        <h2>Create Account</h2>
        <input type="email" id="signup-email" placeholder="Email Address" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button id="btn-signup">Register</button>
        <p class="toggle-link" id="link-to-signin">Already have an account? Sign In</p>
    </div>

    <!-- Messages -->
    <div id="msg-error" class="error"></div>
    <div id="msg-success" class="success"></div>
</div>

<!-- Firebase Modular SDK Script Configuration -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://gstatic.com";

    // Your integrated Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyD0yNWKmaNxZzM4v0Y0vc_dhUNRcYhLbl4",
        authDomain: "myjtlb-e614c.firebaseapp.com",
        projectId: "myjtlb-e614c",
        storageBucket: "myjtlb-e614c.firebasestorage.app",
        messagingSenderId: "939519568881",
        appId: "1:939519568881:web:b7335277d4c3fa1d607250",
        measurementId: "G-44K7NM360T"
    };

    // Initialize Firebase and Authentication
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DOM Elements
    const signinSection = document.getElementById('signin-section');
    const signupSection = document.getElementById('signup-section');
    const statusSection = document.getElementById('status-section');
    const userEmailText = document.getElementById('user-email');
    const errorDiv = document.getElementById('msg-error');
    const successDiv = document.getElementById('msg-success');

    // UI Toggle Functionality
    function toggleView(showSignIn) {
        clearMessages();
        if (showSignIn) {
            signinSection.classList.remove('hidden');
            signupSection.classList.add('hidden');
        } else {
            signinSection.classList.add('hidden');
            signupSection.classList.remove('hidden');
        }
    }

    function clearMessages() {
        errorDiv.innerText = '';
        successDiv.innerText = '';
    }

    document.getElementById('link-to-signup').addEventListener('click', () => toggleView(false));
    document.getElementById('link-to-signin').addEventListener('click', () => toggleView(true));

    // Global Identity Tracker (Listens to sign-ins globally)
    onAuthStateChanged(auth, (user) => {
        clearMessages();
        if (user) {
            signinSection.classList.add('hidden');
            signupSection.classList.add('hidden');
            statusSection.classList.remove('hidden');
            userEmailText.innerText = `Logged in as: ${user.email}`;
        } else {
            statusSection.classList.add('hidden');
            signinSection.classList.remove('hidden');
            userEmailText.innerText = '';
        }
    });

    // Sign Up Logic
    document.getElementById('btn-signup').addEventListener('click', () => {
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        clearMessages();

        createUserWithEmailAndPassword(auth, email, password)
            .then(() => { successDiv.innerText = "Account successfully created!"; })
            .catch(error => { errorDiv.innerText = error.message; });
    });

    // Sign In Logic
    document.getElementById('btn-signin').addEventListener('click', () => {
        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;
        clearMessages();

        signInWithEmailAndPassword(auth, email, password)
            .then(() => { successDiv.innerText = "Welcome back!"; })
            .catch(error => { errorDiv.innerText = error.message; });
    });

    // Sign Out Logic
    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth)
            .then(() => { successDiv.innerText = "Signed out successfully."; })
            .catch(error => { errorDiv.innerText = error.message; });
    });
</script>

</body>
</html>

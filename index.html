<!-- Load the stable web versions of Firebase -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // ⚠️ Make sure these match your real project settings exactly!
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", 
        authDomain: "://firebaseapp.com",
        projectId: "myjtlb",
        storageBucket: "://appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase using the compatibility layer (highly stable)
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let currentMode = 'login';

    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('login-tab').classList.toggle('active', mode === 'login');
        document.getElementById('register-tab').classList.toggle('active', mode === 'register');
        document.getElementById('form-title').innerText = mode === 'login' ? 'Login' : 'Register';
        document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
        document.getElementById('message-box').innerText = '';
    }

    async function handleSubmit(event) {
        event.preventDefault();
        const msgBox = document.getElementById('message-box');
        msgBox.innerText = 'Checking...';
        msgBox.className = 'message';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (currentMode === 'register') {
            try {
                await auth.createUserWithEmailAndPassword(email, password);
                msgBox.innerText = "Account created! Switching to Login...";
                msgBox.className = "message success";
                setTimeout(() => switchTab('login'), 2000);
            } catch (error) {
                msgBox.innerText = error.message;
                msgBox.className = "message error";
            }
        } else {
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // 🚀 SUCCESSFUL ROUTE
                window.location.href = '/myJTLB/Success';
            } catch (error) {
                // 🛑 FAILED ROUTE
                window.location.href = '/myJTLB/Unsuccess';
            }
        }
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account System</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 320px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #e5e5ea; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #8e8e93; font-weight: 600; }
        .tab.active { color: #007aff; border-bottom: 2px solid #007aff; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d1d6; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .message { margin-top: 15px; font-size: 14px; text-align: center; font-weight: 500; }
        .success { color: #34c759; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div id="login-tab" class="tab active" onclick="switchTab('login')">Login</div>
        <div id="register-tab" class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <h2 id="form-title">Login</h2>
    <form id="auth-form" onsubmit="handleSubmit(event)">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="submit-btn">Sign In</button>
    </form>

    <div id="message-box" class="message"></div>
</div>

<!-- Load Firebase Directly from the Web -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://gstatic.com";

    // ⚠️ PASTE YOUR FIREBASE WEB APP CONFIG CONFIGURATION KEYS HERE
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "://firebaseapp.com",
        projectId: "myjtlb",
        storageBucket: "://appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentMode = 'login';

    window.switchTab = function(mode) {
        currentMode = mode;
        document.getElementById('login-tab').classList.toggle('active', mode === 'login');
        document.getElementById('register-tab').classList.toggle('active', mode === 'register');
        document.getElementById('form-title').innerText = mode === 'login' ? 'Login' : 'Register';
        document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
        document.getElementById('message-box').innerText = '';
    }

    window.handleSubmit = async function(event) {
        event.preventDefault();
        const msgBox = document.getElementById('message-box');
        msgBox.innerText = '';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            if (currentMode === 'register') {
                await createUserWithEmailAndPassword(auth, email, password);
                msgBox.innerText = "Account created! Switching to Login...";
                msgBox.className = "message success";
                setTimeout(() => switchTab('login'), 2000);
            } else {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                msgBox.innerText = `Logged in as: ${userCredential.user.email}`;
                msgBox.className = "message success";
                // Redirect user or open dashboard code goes here!
            }
        } catch (error) {
            msgBox.innerText = error.message.replace("Firebase: ", "");
            msgBox.className = "message error";
        }
    }
</script>

</body>
</html>
